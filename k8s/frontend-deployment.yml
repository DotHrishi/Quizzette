apiVersion: apps/v1
kind: Deployment
metadata:
  name: quizzete-frontend
  labels:
    app: quizzete-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quizzete-frontend
  template:
    metadata:
      labels:
        app: quizzete-frontend
    spec:
      containers:
        - name: frontend
          image: dothrishi/quizzete-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
