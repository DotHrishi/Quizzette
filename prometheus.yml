global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus scrapes itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Local Docker backend
  - job_name: "quizzete-backend-local"
    static_configs:
      - targets: ["backend:5000"]
    metrics_path: /metrics
    scheme: http

  # Vercel production backend — uncomment and replace URL after redeployment
  # - job_name: "quizzete-backend-vercel"
  #   static_configs:
  #     - targets: ["your-project.vercel.app"]
  #   metrics_path: /metrics
  #   scheme: https
